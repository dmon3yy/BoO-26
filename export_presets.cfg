vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// Ballad of Orpheus: the threaded build needs cross-origin isolation, which
// GitHub Pages can only get from Godot's service worker. If this browser
// still isn't isolated after the worker is installed, or Godot reports a
// start-up error, switch to the single-threaded lite/ build.
(function () {
	var KEY = 'boo-coi-tries';
	function toLite(why) {
		try { sessionStorage.removeItem(KEY); } catch (e) {}
		console.warn('Switching to the lite build: ' + why);
		location.replace('lite/' + location.search + location.hash);
	}
	function later(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
	if (window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined') {
		try { sessionStorage.removeItem(KEY); } catch (e) {}
	} else {
		var tries = 9;
		try { tries = Number(sessionStorage.getItem(KEY)) || 0; sessionStorage.setItem(KEY, String(tries + 1)); } catch (e) {}
		if (tries >= 2 || !('serviceWorker' in navigator)) { toLite('no cross-origin isolation'); return; }
		// Visit 1: Godot installs the worker and reloads. Visit 2: the worker
		// exists but may not control the page yet (Godot then just stops), so
		// wait for it to be ready and reload ourselves.
		var wait = tries === 0 ? later(6000) : Promise.race([navigator.serviceWorker.ready, later(4000)]);
		wait.then(function () { location.reload(); });
	}
	// Godot writes start-up failures into #status-notice.
	addEventListener('DOMContentLoaded', function () {
		var n = document.getElementById('status-notice');
		if (!n) { return; }
		new MutationObserver(function () {
			if (n.textContent.trim() !== '') { toLite(n.textContent.trim()); }
		}).observe(n, { childList: true, subtree: true, characterData: true });
	});
})();
</script>"
